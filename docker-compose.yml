# Canonical Compose stack of the banner fingerprinting system (plan.md §5.2).
#
#   docker compose up -d                      # start the server
#   docker compose run --rm cli --input /data/sample.json
#   docker compose run --rm cli ping
#
# deploy/docker-compose.yml includes this file, so both of these work:
#   docker compose up -d
#   docker compose -f deploy/docker-compose.yml up -d
name: hsxa-banner-fingerprint

services:
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
      args:
        VERSION: ${BFP_VERSION:-0.1.0}
    image: hsxa-banner-fingerprint/bfp-server:${BFP_VERSION:-0.1.0}
    environment:
      BFP_LISTEN_ADDR: ":8080"
      BFP_LOG_LEVEL: ${BFP_LOG_LEVEL:-info}
      BFP_MAX_BODY: "33554432"
      BFP_MAX_RECORDS: "200000"
      BFP_MAX_BANNER_BYTES: "65536"
      # Mount ./rules to extend or override the built-in rules without a rebuild.
      BFP_RULES_DIR: /rules
    ports:
      - "${BFP_PORT:-8080}:8080"
    volumes:
      - ./rules:/rules:ro
    healthcheck:
      test: ["CMD", "bfp-server", "-health-check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: deploy/cli.Dockerfile
      args:
        VERSION: ${BFP_VERSION:-0.1.0}
    image: hsxa-banner-fingerprint/bfp-cli:${BFP_VERSION:-0.1.0}
    depends_on:
      server:
        condition: service_healthy
    environment:
      BFP_SERVER: http://server:8080
    volumes:
      - ./data:/data:ro
    # One-shot container: it stays out of "docker compose up" on purpose.
    profiles: ["cli"]
    restart: "no"
